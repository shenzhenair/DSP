<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>操作记录 · 数据调度平台</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app">
  <div id="sidebarMount"></div>
  <div class="main">
    <header class="topbar">
      <div><span class="page-t">操作记录</span><span class="page-s">所有人为操作的审计日志：任务/数据源变更、手动运行、登录登出、角色调整等（仅管理员可见）</span></div>
      <div class="top-actions">
        <select class="inp" id="userFilter" style="width:150px;padding:6px 10px;font-size:12px"><option value="">全部操作人</option></select>
        <button class="btn outline" id="btnRefresh">刷新</button>
      </div>
    </header>
    <div class="content">
      <section class="sec">
        <div id="auditList" style="padding:8px 16px 16px"><div class="hint" style="color:var(--sub);font-size:12px">加载中…</div></div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:0 16px 14px">
          <span class="hint" style="color:var(--sub);font-size:11.5px" id="pageInfo"></span>
          <div style="display:flex;gap:8px">
            <button class="btn ghost" id="btnPrev">上一页</button>
            <button class="btn ghost" id="btnNext">下一页</button>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>
<script src="/js/common.js"></script>
<script src="/js/audit.js"></script>
</body>
</html>
