<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>权限管理 · 数据调度平台</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app">
  <div id="sidebarMount"></div>
  <div class="main">
    <header class="topbar">
      <div><span class="page-t">权限管理</span><span class="page-s">控制各账号可见模块：管理员全部可见 · 普通成员可见工作台 · 无权限不可见任何模块</span></div>
      <div class="top-actions"><button class="btn outline" id="btnRefresh">刷新</button></div>
    </header>
    <div class="content">
      <section class="sec">
        <div class="sec-h">
          <div class="sec-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
          <div class="sec-t">用户与角色</div>
          <div class="sec-d">登录过的用户自动出现在此；新用户默认「无权限」，由管理员开通</div>
        </div>
        <div id="userList" style="padding:4px 16px 16px"><div class="hint" style="color:var(--sub);font-size:12px">加载中…</div></div>
        <div class="hint" style="margin:0 16px 14px;color:var(--sub);font-size:11px">
          说明：「史炎平」为默认管理员，不可在此修改自己的角色；变更立即生效，被收回权限的用户刷新页面后即不可见任何模块。
        </div>
      </section>
    </div>
  </div>
</div>
<script src="/js/common.js"></script>
<script src="/js/users.js"></script>
</body>
</html>
